name: release

# Publish to npm on version tags: git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Guard: only run the release flow when the tag matches package.json.
      - name: Tag matches package.json version
        id: tag_guard
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          V="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$V" ]; then
            echo "::warning::tag ${TAG} does not match package.json version ${V} — skipping release workflow"
            echo "matched=false" >> "$GITHUB_OUTPUT"
          else
            echo "matched=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.tag_guard.outputs.matched == 'true'
        run: npm ci

      - name: Run the full test suite
        if: steps.tag_guard.outputs.matched == 'true'
        run: npm test

      # Real-account smoke test. Providers without credentials are skipped, so
      # this passes cleanly with no secrets configured — and becomes a hard
      # gate once the secrets below are added to the repo.
      - name: Real-account smoke test
        if: steps.tag_guard.outputs.matched == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SMOKE_SITE: ${{ secrets.SMOKE_SITE }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SMOKE_VERCEL_PROJECT: ${{ secrets.SMOKE_VERCEL_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SMOKE_S3_BUCKET: ${{ secrets.SMOKE_S3_BUCKET }}
        run: npm run smoke

      # Self-cleaning: remove the smoke artifacts this run (and past runs)
      # created on every provider. Non-fatal so a cleanup hiccup can never
      # block a release.
      - name: Clean up smoke artifacts
        if: steps.tag_guard.outputs.matched == 'true'
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SMOKE_S3_BUCKET: ${{ secrets.SMOKE_S3_BUCKET }}
        run: npm run cleanup -- netlify vercel cloudflare s3 --yes

      # Idempotent: if the version is already on the registry (e.g. the
      # workflow was retried, or the publish was done manually), skip — but
      # still validate the publish token so a broken NPM_TOKEN can't hide.
      - name: Publish to npm
        if: steps.tag_guard.outputs.matched == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="$(node -p "require('./package.json').version")"
          if [ "$(npm view @mayan1124/deploy-cli@$V version 2>/dev/null)" = "$V" ]; then
            npm whoami >/dev/null 2>&1 || { echo "::error::NPM_TOKEN is invalid — publishing will fail for the next version"; exit 1; }
            echo "version $V already published — skipping npm publish (auth OK)"
          else
            npm publish --access public
          fi

      # Verify what actually landed on the registry, from a clean install.
      # The package is public, so verification must not depend on the publish
      # token: a bad NODE_AUTH_TOKEN in the runner npmrc would 401 the install.
      - name: Verify the published package
        if: steps.tag_guard.outputs.matched == 'true'
        run: |
          V="$(node -p "require('./package.json').version")"
          echo "verifying @mayan1124/deploy-cli@$V"
          npm config delete '//registry.npmjs.org/:_authToken' >/dev/null 2>&1 || true
          # npmjs CDN can lag a few seconds behind publish — retry the reads
          REG=""
          for i in 1 2 3 4 5 6; do
            REG="$(npm view @mayan1124/deploy-cli version 2>/dev/null)" && [ "$REG" = "$V" ] && break
            sleep 5
          done
          [ "$REG" = "$V" ] || { echo "::error::registry has $REG, expected $V"; exit 1; }
          DIR="$(mktemp -d)"; cd "$DIR"
          npm init -y >/dev/null
          for i in 1 2 3 4 5 6; do
            npm install "@mayan1124/deploy-cli@$V" >/dev/null 2>&1 && break
            sleep 5
          done
          test -x ./node_modules/.bin/deploy || { echo "::error::npm install failed"; exit 1; }
          ACT="$(./node_modules/.bin/deploy --version | tr -d '\r')" || { echo "::error::deploy --version failed"; exit 1; }
          if [ "$ACT" != "$V" ]; then
            echo "::debug::ACT=[$ACT] length=${#ACT} hex=$(printf '%s' "$ACT" | od -An -tx1 | tr -d ' \n')"
            echo "::debug::bin: $(ls -la node_modules/.bin/ | tr '\n' ' ')"
            echo "::debug::direct: $(node node_modules/@mayan1124/deploy-cli/cli.js --version)"
            echo "::error::deploy reports [$ACT], expected $V"
            exit 1
          fi
          ./node_modules/.bin/deploy doctor --json >/dev/null || { echo "::error::deploy doctor failed"; exit 1; }
          node -e "import('@mayan1124/deploy-cli').then(m => { if (!('runDoctor' in m)) process.exit(1) })" || { echo "::error::API import failed"; exit 1; }
          echo "published @mayan1124/deploy-cli@$V verified from a clean install"

      # GitHub Release with the templated notes (runs last, so it only fires
      # once every other step is green). Idempotent for re-runs.
      - name: Create GitHub Release
        if: steps.tag_guard.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          sed -e "s/__VERSION__/$TAG/g" -e "s/__DATE__/$(date -u +%Y-%m-%d)/g" .github/release_template.md > /tmp/release-notes.md
          gh release create "$TAG" --title "deploy-cli $TAG" --notes-file /tmp/release-notes.md \
            || echo "release $TAG already exists — skipping"
